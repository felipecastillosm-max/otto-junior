<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Otto Junior</title>
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <header class="topbar">
    <img src="assets/wordmark.png" alt="Otto Junior" class="wordmark">
    <span class="badge online" id="net-badge">En línea</span>
  </header>

  <div class="card trip-card-wrap">
    <div class="trip-card">
      <div class="trip-info">
        <div class="section-title"><strong>Viaje actual</strong></div>
        <div style="font-size:18px; font-weight:600;">Iquique → Santiago</div>
        <div style="color:var(--text-dim); font-size:14px;">32 pasajeros a bordo</div>
      </div>
      <img src="assets/logo.webp" alt="Otto Junior" class="trip-logo">
    </div>

    <div class="trip-progress">
      <div class="trip-progress-fill" style="width:45%;"></div>
    </div>
    <div class="trip-progress-labels">
      <span>Iquique</span>
      <span>45%</span>
      <span>Santiago</span>
    </div>
  </div>

  <div class="home-grid">
    <div class="card map-card">
      <div class="map-placeholder">
        <svg class="route-line" viewBox="0 0 200 120" preserveAspectRatio="none">
          <path d="M10,105 Q55,25 100,60 T190,15" stroke="var(--accent)" stroke-width="3" fill="none" stroke-dasharray="6 6" opacity="0.55"/>
          <circle cx="10" cy="105" r="4" fill="var(--accent)" opacity="0.7"/>
          <circle cx="190" cy="15" r="4" fill="var(--secondary)" opacity="0.7"/>
        </svg>
        <img src="assets/bus-marker.png" alt="Bus" class="bus-marker">
      </div>
      <div class="mini-alert">
        <div class="mini-alert-title">Advertencia</div>
        <div class="mini-alert-label">Próxima baja: asientos <strong>2, 16, 24</strong> — Pozo Almonte</div>
      </div>
    </div>

    <div class="card actions-card">
      <a class="btn" href="pasajeros.html">Relación de pasajeros</a>
      <a class="btn" href="paradero.html">Aviso de paradero</a>
      <a class="btn" href="reporte.html">Reporte WhatsApp</a>
    </div>
  </div>

  <footer class="footer-credits">
    Felipe Rulo Castillo · Soluciones digitales con IA<br>
    <a href="mailto:rulo@corvalia.cl">rulo@corvalia.cl</a>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
